aid: cogniac
name: Cogniac
description: >-
  Cogniac is a low-code enterprise AI computer-vision platform that turns visual
  data from cameras and image/video streams into automated visual inspection and
  defect detection across manufacturing, transportation, logistics, and
  government operations. Its cloud platform (CloudCore) exposes a multi-tenant
  public REST API at api.cogniac.io covering tenants, applications
  (classification, box/point detection, http_input, camera_capture, and
  integration types), subjects, media, detections, on-premise EdgeFlow GPU
  appliances, cloud-hosted CloudFlow, network cameras, deployment groups, and
  workflows. Cogniac ships an official Python SDK and CLI (plus an archived C#
  SDK) and a provider-published agent skill, and is SOC 2 compliant.
